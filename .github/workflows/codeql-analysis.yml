# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
---
name: "CodeQL"
on:  # yamllint disable-line rule:truthy
  pull_request:
    branches: ["master", "stable"]
  push:
    paths: [".github/workflows/codeql-analysis.yml"]
  schedule:
    - cron: '17 5 * * 1'

concurrency:
  group: Multicast-CodeQL
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'actions']
        # CodeQL supports ['c', 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby', 'rust', 'swift', 'actions']
        # Learn more about CodeQL language support at https://git.io/codeql-language-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
        submodules: ${{ matrix.language == 'actions' || false }}
        repository: reactive-firewall-org/multicast

    - id: build-python
      if: ${{ !cancelled() && (matrix.language == 'python' || false) }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "${{ vars.PYTHON_DEFAULT }}"
    - id: output_python
      name: "bootstrap Python"
      if: ${{ !cancelled() && (matrix.language == 'python' || false) }}
      shell: bash
      run: |
        printf "%s\n" "::group::bootstrap-python-env"
        printf "python-path=%s\n" "${{ steps.build-python.outputs.python-path }}" >> "$GITHUB_OUTPUT"
        printf "PYTHON=%s\n" "${{ steps.build-python.outputs.python-path }}" >> "$GITHUB_ENV"
        printf "python-version=%s\n" "${{ steps.build-python.outputs.python-version }}" >> "$GITHUB_OUTPUT"
        printf "PYTHON_VERSION=%s\n" "${{ steps.build-python.outputs.python-version }}" >> "$GITHUB_ENV"
        printf "%s\n" "::endgroup::"
    - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      if: ${{ !cancelled() && (matrix.language == 'python' || false) }}
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Pre-Clean
      id: clean
      if: ${{ !cancelled() && (matrix.language == 'python' || false) }}
      shell: bash
      run: make -j1 -f Makefile purge 2>/dev/null || true

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      if: ${{ !cancelled() }}
      uses: github/codeql-action/init@854f647b7e1bb85c95cddabcd46b0c578ec92bc1a  # v4.36.3
      with:
        languages: ${{ matrix.language }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        # queries: ./path/to/local/query, your-org/your-repo/queries@main

    # Autobuild attempts to build any compiled languages  (C/C++, C#, or Java).
    # If this step fails, then you should remove it and run the build manually (see below)
    # - name: Autobuild
    #  uses: github/codeql-action/autobuild@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a  # v4.36.3

    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 https://git.io/JvXDl

    # ✏️ If the Autobuild fails above, remove it and uncomment the following three lines
    #    and modify them (or add more) to build your code if your project
    #    uses a compiled language

    - name: "License"
      id: show-build-license
      shell: bash
      if: ${{ (matrix.language == 'python' || false) && (github.repository == 'reactive-firewall-org/multicast') }}
      run: |
        if [[ -r LICENSE.md ]] ; then
          printf "\n\n"
          cat <LICENSE.md ;
          printf "\n\n"
        else
          printf "%s\n" "::Error title=UNLICENSED:: This is an UNLICENSED Build" >&2
          exit 1
        fi
    - name: Test Build
      if: ${{ !cancelled() && (matrix.language == 'python' || false) }}
      id: build
      shell: bash
      run: make -j1 -f Makefile build

    - id: code-cq-analysis
      if: ${{ !cancelled() }}
      name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a  # v4.36.3
